<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Sıralama | Baykuş</title>
<style>
:root{
  --bg:#0b1233; --bg-deep:#04071a; --ink:#f3eedf; --ink-soft:rgba(243,238,223,.74); --ink-faint:rgba(243,238,223,.5);
  --gold:#e7c063; --gold-line:rgba(231,192,99,.5); --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.1);
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Figtree",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e9edf7; --bg-deep:#d5dcee; --ink:#141d45; --ink-soft:rgba(20,29,69,.75); --ink-faint:rgba(20,29,69,.5);
  --gold:#9a6b12; --gold-line:rgba(154,107,18,.45); --surface:rgba(255,255,255,.65); --surface-2:rgba(20,29,69,.08);
  color-scheme:light;}}
:root[data-theme="dark"]{
  --bg:#0b1233; --bg-deep:#04071a; --ink:#f3eedf; --ink-soft:rgba(243,238,223,.74); --ink-faint:rgba(243,238,223,.5);
  --gold:#e7c063; --gold-line:rgba(231,192,99,.5); --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.1);
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:linear-gradient(180deg,var(--bg),var(--bg-deep)) fixed var(--bg-deep);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:48px 22px 64px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--surface-2)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:22px 6px;
  border-bottom:1px solid var(--surface-2);text-decoration:none;transition:background .2s}
a.row:hover{background:var(--surface)}
.row .ic{width:56px;height:56px;border:1.5px solid var(--gold-line);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.row .ic svg{width:26px;height:26px}
.row h2{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1;margin:0 0 6px}
.row p{margin:0;color:var(--ink-soft);font-size:.98rem}
.row .go{color:var(--gold);width:22px;height:22px}
.row.soon{opacity:.6}
.pill{font-size:.78rem;font-weight:600;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-faint);text-decoration:none;font-weight:600;font-size:.95rem;margin-bottom:28px}
.back:hover{color:var(--gold)}
.back svg{width:18px;height:18px}
footer{margin-top:40px;color:var(--ink-faint);font-size:.85rem}
@media (max-width:420px){.row{grid-template-columns:44px 1fr auto;gap:14px}.row .ic{width:44px;height:44px}.row h2{font-size:1.7rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,12vw,4.4rem);line-height:.95;margin:0}
.sub{color:var(--ink-soft);margin:10px 0 32px}
.sira-link{display:inline-flex;align-items:center;gap:8px;margin:-14px 0 28px;color:var(--gold);font-weight:600;text-decoration:none;border:1.5px solid var(--gold-line);border-radius:999px;padding:8px 16px}
.sira-link:hover{border-color:var(--gold)}
.sira-link svg{width:20px;height:20px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.meta span{font-size:.8rem;color:var(--ink-faint);border:1px solid var(--surface-2);border-radius:999px;padding:2px 10px}
.sekmeler{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.sek{font:600 .9rem var(--sans);color:var(--ink-soft);background:transparent;border:1.5px solid var(--surface-2);border-radius:999px;padding:8px 14px;cursor:pointer}
.sek[aria-selected="true"]{color:var(--bg-deep);background:var(--gold);border-color:var(--gold)}
.ust{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.ust h2{font-family:var(--serif);font-weight:700;font-size:2rem;margin:0}
.ust a{color:var(--gold);font-weight:600;text-decoration:none;white-space:nowrap}
.yenile{background:none;border:none;color:var(--ink-faint);font:600 .9rem var(--sans);cursor:pointer;padding:0}
.yenile:hover{color:var(--gold)}
#liste .bk-liste li{font-size:1.05rem;padding:11px 8px}
</style>
<script src="ortak/ayarlar.js"></script>
<script src="ortak/oyun.js"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Oyunlar</a>
  <h1>Sıralama</h1>
  <p class="sub" id="kapsam"></p>
  <div class="sekmeler" role="tablist" id="sekmeler"></div>
  <div class="ust"><h2 id="baslik"></h2><span><button class="yenile" id="yenile">Yenile</button></span></div>
  <div id="liste"></div>
  <p style="margin-top:22px"><a class="sira-link" id="oyna" href="#">Bu oyunu oyna</a></p>
</div>
<script>
const OYUNLAR = [
  {id:"hafiza", ad:"Hafıza Kartları", file:"hafiza.html"},
  {id:"hesap",  ad:"Hızlı Hesap",     file:"matematik.html"},
  {id:"isik",   ad:"Işıkları Söndür", file:"mantik.html"},
  {id:"kelime", ad:"Kelime Avı",      file:"kelime.html"},
  {id:"renk",   ad:"Renk Tuzağı",     file:"renk.html"},
  {id:"kale",   ad:"Son Kale",        file:"kale.html"}
];
let aktif = OYUNLAR.find(o => o.id === location.hash.slice(1)) || OYUNLAR[0];
document.getElementById("kapsam").textContent = BaykusSkor.UZAK
  ? `Sezon ${BaykusSkor.SEZON}. Her oyuncunun en iyi skoru görünür.`
  : "Skorlar şimdilik sadece bu cihazda tutuluyor.";
function goster(){
  document.querySelectorAll(".sek").forEach(b => b.setAttribute("aria-selected", b.dataset.id === aktif.id));
  document.getElementById("baslik").textContent = aktif.ad;
  document.getElementById("oyna").href = aktif.file;
  document.getElementById("oyna").textContent = aktif.ad + " oyna";
  BaykusSkor.listeyiDoldur(document.getElementById("liste"), aktif.id, 25);
}
document.getElementById("sekmeler").innerHTML = OYUNLAR.map(o => `<button class="sek" role="tab" data-id="${o.id}">${o.ad}</button>`).join("");
document.getElementById("sekmeler").onclick = e => { const b = e.target.closest(".sek"); if(!b) return; aktif = OYUNLAR.find(o => o.id === b.dataset.id); history.replaceState(null, "", "#" + aktif.id); goster(); };
document.getElementById("yenile").onclick = goster;
goster();
function drawSky(){
  const c=document.getElementById("sky"),dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const x=c.getContext("2d");x.scale(dpr,dpr);
  const light=matchMedia("(prefers-color-scheme: light)").matches;
  let s=42;const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
  for(let i=0;i<160;i++){x.globalAlpha=(.25+r()*.75)*(light?.3:1);x.fillStyle=light?"#141d45":"#fff";x.beginPath();x.arc(r()*innerWidth,r()*innerHeight,.3+r()*1.1,0,Math.PI*2);x.fill();}
}
addEventListener("resize",drawSky);matchMedia("(prefers-color-scheme: light)").addEventListener("change",drawSky);drawSky();
</script>
</body>
</html>
